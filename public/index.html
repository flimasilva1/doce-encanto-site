<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Os campos {{...}} são preenchidos pelo servidor com data/negocio.json -->
  <title>{{titulo}}</title>
  <meta name="description" content="{{descricao}}">
  <link rel="canonical" href="{{url}}">
  <meta name="theme-color" content="{{corTema}}">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="{{nome}}">
  <meta property="og:title" content="{{titulo}}">
  <meta property="og:description" content="{{descricao}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{imagem}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{nome}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{titulo}}">
  <meta name="twitter:description" content="{{descricao}}">
  <meta name="twitter:image" content="{{imagem}}">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="{{heroImagem}}" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>{{{coresCss}}}</style>
  <script type="application/ld+json">{{{jsonLd}}}</script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo" id="topo">
    <div class="topo__barra container">
      <a class="marca" href="#inicio" aria-label="{{nome}} - início">
        <span class="marca__icone" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 18h20v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="currentColor" opacity=".35"/><path d="M8 12h16a2 2 0 0 1 2 2v4H6v-4a2 2 0 0 1 2-2z" fill="currentColor" opacity=".6"/><path d="M16 4c1.5 2 1.5 3.5 0 5-1.5-1.5-1.5-3 0-5z" fill="currentColor"/><path d="M16 9v3" stroke="currentColor" stroke-width="1.5"/></svg>
        </span>
        <span class="marca__nome">{{nomeCurto}}</span>
      </a>
      <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="menu" id="menu" aria-label="Menu principal">
        <a href="#sobre">Sobre</a>
        <a href="#bolos">Bolos</a>
        <a href="#kits">Kits festa</a>
        <a href="#como-encomendar">Como encomendar</a>
        <a href="#depoimentos">Depoimentos</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <!-- 1. INÍCIO -->
    <section class="inicio" id="inicio">
      <img class="inicio__foto" src="{{heroImagem}}" alt="{{heroAlt}}" width="1600" height="1000" fetchpriority="high" decoding="async">
      <div class="inicio__conteudo container">
        <p class="sobretitulo">{{nome}}</p>
        <h1>{{heroTitulo}}</h1>
        <p class="inicio__frase">{{heroFrase}}</p>
        <a class="botao botao--principal" href="{{waLink}}" target="_blank" rel="noopener" data-wa="padrao">
          <svg class="icone" aria-hidden="true"><use href="#i-whatsapp"/></svg>
          {{heroBotao}}
        </a>
      </div>
    </section>

    <!-- 2. SOBRE -->
    <section class="secao sobre" id="sobre">
      <div class="container sobre__grade">
        <figure class="sobre__foto foto-moldura revelar" data-sobre-foto></figure>
        <div class="sobre__texto revelar">
          <p class="sobretitulo">Sobre</p>
          <h2 data-texto="sobre.titulo"></h2>
          <div data-sobre-paragrafos></div>
          <p class="assinatura" data-texto="sobre.assinatura"></p>
        </div>
      </div>
    </section>

    <!-- 3. BOLOS -->
    <section class="secao secao--rosa" id="bolos">
      <div class="container">
        <header class="secao__cabecalho revelar">
          <h2 data-texto="secoes.bolos.titulo"></h2>
          <p data-texto="secoes.bolos.subtitulo"></p>
        </header>
        <div class="filtros" role="toolbar" aria-label="Filtrar bolos por categoria" data-filtros></div>
        <p class="filtros__contagem" aria-live="polite" data-contagem></p>
        <ul class="galeria" data-galeria></ul>
      </div>
    </section>

    <!-- 4. KITS FESTA -->
    <section class="secao" id="kits">
      <div class="container">
        <header class="secao__cabecalho revelar">
          <h2 data-texto="secoes.kits.titulo"></h2>
          <p data-texto="secoes.kits.subtitulo"></p>
        </header>
        <ul class="kits" data-kits></ul>
      </div>
    </section>

    <!-- 5. COMO ENCOMENDAR -->
    <section class="secao secao--rosa" id="como-encomendar">
      <div class="container">
        <header class="secao__cabecalho revelar">
          <h2 data-texto="secoes.comoEncomendar.titulo"></h2>
          <p data-texto="secoes.comoEncomendar.subtitulo"></p>
        </header>
        <ol class="passos" data-passos></ol>
        <div class="aviso revelar">
          <svg class="icone" aria-hidden="true"><use href="#i-relogio"/></svg>
          <div>
            <p class="aviso__titulo" data-antecedencia></p>
            <p data-aviso></p>
            <p class="aviso__obs" data-texto="comoEncomendar.observacao"></p>
          </div>
        </div>
        <p class="centro">
          <a class="botao botao--principal" href="{{waLink}}" target="_blank" rel="noopener" data-wa="padrao">
            <svg class="icone" aria-hidden="true"><use href="#i-whatsapp"/></svg>
            Pedir orçamento no WhatsApp
          </a>
        </p>
      </div>
    </section>

    <!-- 6. DEPOIMENTOS -->
    <section class="secao" id="depoimentos">
      <div class="container">
        <header class="secao__cabecalho revelar">
          <h2 data-texto="secoes.depoimentos.titulo"></h2>
          <p data-texto="secoes.depoimentos.subtitulo"></p>
        </header>
        <ul class="depoimentos" data-depoimentos></ul>
      </div>
    </section>

    <!-- 7. CONTATO -->
    <section class="secao secao--rosa" id="contato">
      <div class="container">
        <header class="secao__cabecalho revelar">
          <h2 data-texto="secoes.contato.titulo"></h2>
          <p data-texto="secoes.contato.subtitulo"></p>
        </header>
        <ul class="contato" data-contato></ul>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p class="rodape__marca">{{nome}}</p>
      <p data-rodape></p>
    </div>
  </footer>

  <!-- Botão flutuante do WhatsApp -->
  <a class="whatsapp-flutuante" href="{{waLink}}" target="_blank" rel="noopener" data-wa="padrao" aria-label="Pedir orçamento no WhatsApp">
    <svg aria-hidden="true"><use href="#i-whatsapp"/></svg>
  </a>

  <!-- Foto ampliada (lightbox) -->
  <dialog class="lightbox" aria-label="Foto ampliada">
    <button class="lightbox__fechar" type="button" aria-label="Fechar" data-lb="fechar">&times;</button>
    <button class="lightbox__nav lightbox__nav--ant" type="button" aria-label="Foto anterior" data-lb="anterior">&#8249;</button>
    <figure class="lightbox__figura">
      <img alt="" data-lb="img">
      <figcaption>
        <strong data-lb="nome"></strong>
        <span data-lb="descricao"></span>
        <small data-lb="detalhes"></small>
        <a class="botao botao--principal botao--pequeno" target="_blank" rel="noopener" data-lb="whatsapp">
          <svg class="icone" aria-hidden="true"><use href="#i-whatsapp"/></svg>
          Quero um bolo assim
        </a>
      </figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--prox" type="button" aria-label="Próxima foto" data-lb="proxima">&#8250;</button>
  </dialog>

  <!-- Ícones -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.45 9.45 0 0 1-4.82-1.32l-.35-.21-3.58.94.96-3.49-.23-.36a9.43 9.43 0 0 1-1.45-5.03c0-5.22 4.25-9.47 9.48-9.47a9.4 9.4 0 0 1 6.7 2.78 9.41 9.41 0 0 1 2.77 6.7c0 5.22-4.25 9.46-9.47 9.46zm8.06-17.53A11.3 11.3 0 0 0 12.04.63C5.76.63.64 5.74.64 12.03c0 2.01.52 3.97 1.52 5.7L.55 23.63l6.04-1.58a11.4 11.4 0 0 0 5.45 1.39h.01c6.28 0 11.4-5.12 11.4-11.4 0-3.05-1.19-5.91-3.35-8.07z"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M7 2.5h10A4.5 4.5 0 0 1 21.5 7v10a4.5 4.5 0 0 1-4.5 4.5H7A4.5 4.5 0 0 1 2.5 17V7A4.5 4.5 0 0 1 7 2.5zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-local" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-relogio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-pessoas" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14c2.2.6 3.5 2.6 3.5 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <script src="/js/app.js" defer></script>
</body>
</html>
